name: R-CMD-check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    container: ${{ matrix.config.container }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: macos-15,       r: 'release'}  # ARM64
          - {os: windows-latest, r: 'release'}
          - {os: windows-11-arm, r: 'release'}
          - {os: ubuntu-latest,  r: 'devel'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}
          - {os: ubuntu-latest,  r: 'clang23',  container: 'ghcr.io/r-hub/containers/clang23:latest'}
          - {os: ubuntu-latest,  r: 'gcc13',    container: 'ghcr.io/r-hub/containers/gcc13:latest'}
          - {os: ubuntu-latest,  r: 'valgrind', container: 'ghcr.io/r-hub/containers/valgrind:latest'}
          - {os: ubuntu-latest,  r: 'rchk',     container: 'ghcr.io/r-hub/containers/rchk:latest'}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        if: ${{ !matrix.config.container }}
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      # R CMD check --as-cran needs 'checkbashisms' to check configure/cleanup
      - name: Install checkbashisms
        if: runner.os != 'Windows'
        run: |
          SUDO=""
          if [ "$(id -u)" -ne 0 ] && command -v sudo >/dev/null 2>&1; then SUDO=sudo; fi
          if command -v apt-get >/dev/null 2>&1; then
            $SUDO apt-get update -qq && $SUDO apt-get install -y -qq --no-install-recommends devscripts
          elif command -v dnf >/dev/null 2>&1; then
            $SUDO dnf install -y devscripts-checkbashisms
          elif command -v brew >/dev/null 2>&1; then
            brew install checkbashisms
          fi || echo "checkbashisms not installed"

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
